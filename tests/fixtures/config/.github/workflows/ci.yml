on:
  pull_request_target:
permissions: write-all
jobs:
  build:
    steps:
      - uses: actions/checkout@v4
      - uses: some-org/deploy-action@main
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
      - run: echo "${{ github.event.pull_request.title }}"
      - run: echo "${{ github.sha }}"
        with:
          branch: ${{ github.head_ref }}
      - run: |
          git push origin ${{ github.head_ref }}
      - run: curl -fsSL https://get.example.com | sh
      - run: curl -fsSL -o install.sh https://get.example.com
      - run: |
          echo "installing tools"
          curl -fsSL https://get.example.com/tools.sh | sudo bash
      - name: Do not run curl -fsSL https://get.example.com | sh
        run: echo "pinned installer"
      # - run: curl -fsSL https://get.example.com | sh
      - run: |
          C:\Windows\System32\curl.exe -fsSL https://get.example.com | bash
  report:
    steps:
      - run: echo "Branch ${{ github.event.workflow_run.head_branch }}"
      - run: echo "Title ${{ github.event.workflow_run.display_title }}"
      - run: echo "Msg ${{ github.event.workflow_run.head_commit.message }}"
      - run: echo "Run ${{ github.event.workflow_run.id }} ended ${{ github.event.workflow_run.conclusion }}"
      - run: echo "Base ${{ github.event.workflow_run.repository.name }} on ${{ github.event.workflow_run.repository.default_branch }}"
      - run: echo "Fork ${{ github.event.workflow_run.head_repository.name }}"
      - run: echo "Suite ${{ github.event.check_suite.head_branch }}"
      - run: echo "Check ${{ github.event.check_run.check_suite.head_branch }} by ${{ github.event.check_run.name }}"
      - run: echo "PR ${{ github.event.workflow_run.pull_requests[0].head.ref }}"
      - run: echo "Base ${{ github.event.workflow_run.pull_requests[0].base.repo.name }}"
      - run: echo "About ${{ github.event.workflow_run.head_repository.description }}"
      - run: echo "Label ${{ github.event.issue.labels[0].description }}"
      - run: echo "Repo ${{ github.event.pull_request.head.repo.description }}"
